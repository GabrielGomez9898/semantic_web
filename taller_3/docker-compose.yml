services:
  fuseki:
    image: stain/jena-fuseki:4.8.0
    container_name: ws2026-fuseki
    ports:
      - "3030:3030"
    environment:
      ADMIN_PASSWORD: taller2
      JVM_ARGS: -Xmx2g
    volumes:
      - fuseki-datos:/fuseki
      - ./configuracion:/fuseki/configuration
      - ./:/staging:ro
    restart: unless-stopped

volumes:
  fuseki-datos: